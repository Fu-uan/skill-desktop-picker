<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>Skill Desktop Picker</title><link rel="stylesheet" href="style.css"></head><body data-theme="graphite">
<link rel="stylesheet" href="accessibility.css">
<header><div class="logo">✦</div><div class="brand"><b>Skill 随行</b><span id="summary">正在发现技能…</span></div><div class="tools"><button id="pin" title="置顶" aria-label="切换置顶" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 3h6m-5 0v6l-4 4v2h12v-2l-4-4V3M12 15v6"/></svg></button><button id="fold" title="收起" aria-label="收起或展开"><svg viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></svg></button></div></header>
<main id="panel"><div class="topline"><select id="agent" aria-label="目标 Agent"><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="hermes">Hermes</option><option value="openclaw">OpenClaw</option><option value="other">其他 AI</option></select><button id="sourcesButton">技能来源</button><button id="refresh" title="重新扫描">刷新</button><button id="minimize" title="最小化">—</button></div>
<div class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="query" placeholder="搜索技能名称、描述…" aria-label="搜索技能"><kbd>/</kbd></div>
<nav id="categories" aria-label="分类"></nav><div class="bar"><span id="count"></span><select id="scope" aria-label="筛选"><option value="all">全部技能</option><option value="installed">此 Agent 已发现</option><option value="selected">已选择</option><option value="favorite">收藏</option></select></div>
<section id="list" aria-label="技能列表"></section><section id="details" hidden></section><section id="sources" hidden><div class="bar"><b>技能来源</b><button id="closeSources">关闭</button></div><p>只读取目录。移除来源不会删除技能文件。</p><div id="sourceList"></div><div class="bar"><select id="sourceAgent"><option value="library">共享技能库</option><option value="codex">Codex 安装目录</option><option value="claude">Claude Code 安装目录</option><option value="hermes">Hermes 安装目录</option><option value="openclaw">OpenClaw 安装目录</option></select><button id="addSource">添加目录</button></div></section>
<footer><div class="bar"><span>本次使用</span><button id="clear">清空</button></div><div id="selected"></div><div class="target" id="target">先定位 AI 输入框，再按 Ctrl+Alt+K</div><div class="actions"><button id="copy">复制调用文字</button><button id="insert" class="primary">插入草稿 ↗</button></div><div class="palette"><span>颜色风格</span><select id="theme" aria-label="颜色风格"><option value="graphite">石墨</option><option value="paper">纸白</option><option value="blue">雾蓝</option><option value="amber">琥珀</option></select><button id="quit">退出</button></div><div id="message" role="status">插入不会自动发送 · 兼容性需在目标 Agent 验证</div></footer></main><script src="renderer.js"></script></body></html>
